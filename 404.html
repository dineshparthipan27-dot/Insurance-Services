<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SecureLife | 404 Page Not Found</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        :root {

            --primary-blue: #1E3A8A;
            --primary-teal: #0D9488;
            --primary-blue-light: rgba(30, 58, 138, 0.1);
            --accent-gold: #F59E0B;
            --bg-light: #f8fafc;
            --text-dark: #1F2937;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            overflow: hidden;
        }

        .text-teal {
            color: var(--primary-teal);
        }


        .error-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1;
        }


        .ambient-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            z-index: -1;
            animation: pulseGlow 6s infinite alternate;
        }

        .glow-blue {
            width: 400px;
            height: 400px;
            background: var(--primary-blue);
            top: -100px;
            left: -100px;
        }

        .glow-teal {
            width: 350px;
            height: 350px;
            background: var(--primary-teal);
            bottom: -100px;
            right: -100px;
            animation-delay: 2s;
        }

        @keyframes pulseGlow {
            0% {
                transform: scale(1);
                opacity: 0.1;
            }

            100% {
                transform: scale(1.3);
                opacity: 0.2;
            }
        }


        .error-content {
            text-align: center;
            max-width: 600px;
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        .error-code {
            font-size: 12rem;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-teal) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 20px 40px rgba(30, 58, 138, 0.1);

            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }


        .error-title {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--primary-blue);
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        .error-desc {
            font-size: 1.15rem;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 40px;
        }


        .error-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .btn-solid {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: var(--primary-blue);
            color: #ffffff;
            padding: 16px 35px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 800;
            text-decoration: none;
            transition: all 0.4s ease;
            box-shadow: 0 10px 20px rgba(30, 58, 138, 0.15);
        }

        .btn-solid:hover {
            background: var(--accent-gold);
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(245, 158, 11, 0.25);
        }

        .btn-outline {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: transparent;
            color: var(--primary-blue);
            border: 2px solid var(--primary-blue);
            padding: 14px 35px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .btn-outline:hover {
            background: var(--primary-blue-light);
            transform: translateY(-3px);
        }


        .btn-solid i,
        .btn-outline i {
            transition: transform 0.3s ease;
        }

        .btn-solid:hover i {
            transform: translateX(5px);
        }

        .btn-outline:hover i {
            transform: translateX(-5px);
        }


        @media (max-width: 768px) {
            .error-code {
                font-size: 8rem;
            }

            .error-title {
                font-size: 2.2rem;
            }

            .error-desc {
                font-size: 1.05rem;
                margin-bottom: 30px;
            }

            .error-actions {
                flex-direction: column-reverse;
                gap: 15px;
            }

            .btn-solid,
            .btn-outline {
                width: 100%;
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="error-container">
        <div class="ambient-glow glow-blue"></div>
        <div class="ambient-glow glow-teal"></div>

        <div class="error-content">
            <h1 class="error-code">404</h1>

            <div class="error-text-wrap">
                <h2 class="error-title">Oops! Page <span class="text-teal">Not Found.</span></h2>
                <p class="error-desc">
                    The page you are looking for might have been removed, had its name changed, or is temporarily
                    unavailable. Let's get you back on track.
                </p>
            </div>

            <div class="error-actions">
                <button id="goBackBtn" class="btn-outline">
                    <i class="fa-solid fa-arrow-left-long"></i> Go Back
                </button>
                <a href="index.html" class="btn-solid">
                    <i class="fa-solid fa-house"></i> Go to Home
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {


            const goBackBtn = document.getElementById('goBackBtn');

            if (goBackBtn) {
                goBackBtn.addEventListener('click', function () {

                    if (window.history.length > 1) {
                        window.history.back();
                    } else {

                        window.location.href = 'index.html';
                    }
                });
            }

        });
    </script>
</body>

</html>
